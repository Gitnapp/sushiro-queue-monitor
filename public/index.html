<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寿司郎排队</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fafafa;
  --surface:#ffffff;
  --ink:#0a0a0a;
  --ink-2:#525252;
  --ink-3:#a3a3a3;
  --line:#e5e5e5;
  --line-soft:#f0f0f0;
  --accent:#dc2626;
  --hover:#f5f5f5;
}
html,body{font-family:-apple-system,"SF Pro Text",system-ui,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"ss01" 1}
body{min-height:100vh;font-size:14px;line-height:1.5}

header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;font-weight:600;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}
h1 .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#info{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
#skill-btn{background:var(--ink);color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;margin-left:14px;letter-spacing:0.01em;transition:opacity .15s}
#skill-btn:hover{opacity:.8}

.hero{padding:24px 20px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.metrics{display:flex;gap:36px;flex-wrap:wrap;margin-bottom:18px}
.metric{display:flex;flex-direction:column;gap:2px}
.metric-label{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
.metric-value{font-size:28px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.metric-delta{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px}
.metric-delta.up{color:var(--accent)}
.metric-delta.down{color:#059669}

.trend-wrap{margin-top:6px;position:relative}
.trend-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.trend-title{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
.trend-range{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.trend-range button{background:transparent;border:none;padding:4px 10px;font-size:11px;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.trend-range button:last-child{border-right:none}
.trend-range button.active{background:var(--ink);color:#fff}
.trend-range button:not(.active):hover{background:var(--hover)}
#trend-chart{width:100%;height:160px;display:block}
.trend-tooltip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:5;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}

#controls{padding:14px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
#controls button{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums;transition:all .12s}
#controls button:hover{border-color:var(--ink-3);color:var(--ink)}
#controls button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

#content{padding:14px 20px 40px}
.city-block{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.city-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;transition:background .12s}
.city-header:hover{background:var(--hover)}
.city-name{font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px}
.city-name .chev{color:var(--ink-3);transition:transform .2s;display:inline-block}
.city-block.open .chev{transform:rotate(90deg)}
.city-stats{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.city-stats strong{color:var(--ink);font-weight:600}
.store-list{display:none;border-top:1px solid var(--line-soft)}
.city-block.open .store-list{display:block}
.store-row{padding:11px 16px 11px 36px;display:grid;grid-template-columns:1fr 80px 56px;gap:12px;align-items:center;border-bottom:1px solid var(--line-soft);font-size:13px}
.store-row:last-child{border-bottom:none}
.store-row:hover{background:var(--hover)}
.store-name{display:flex;align-items:center;gap:8px;min-width:0}
.store-name .status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-open{background:#10b981}
.status-closed{background:var(--ink-3)}
.store-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket-tag{font-size:10px;color:var(--ink-3);border:1px solid var(--line);padding:1px 5px;border-radius:3px;flex-shrink:0}
.ticket-tag.off{color:var(--ink-3);background:var(--line-soft)}
.store-spark{height:22px;color:var(--ink-3);overflow:hidden}
.store-spark svg{display:block}
.wait-cell{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;font-feature-settings:"tnum"}
.wait-cell.w0{color:var(--ink-3);font-weight:400}
.wait-cell.w1{color:var(--ink)}
.wait-cell.w2{color:var(--ink);font-weight:600}
.wait-cell.w3{color:var(--accent);font-weight:600}
.wait-cell small{font-size:10px;color:var(--ink-3);font-weight:400;margin-left:2px}
.offline{opacity:.5}

#loading,#error{text-align:center;padding:40px 20px;color:var(--ink-3);font-size:13px}
#error{color:var(--accent);display:none}
footer{padding:24px 20px 40px;text-align:center;font-size:11px;color:var(--ink-3);letter-spacing:0.02em}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.4);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:680px;max-height:80vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.15)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:14px;font-weight:600}
.modal-close{background:none;border:none;color:var(--ink-3);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.modal-close:hover{color:var(--ink)}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.modal-body p{color:var(--ink-2);font-size:12px;margin-bottom:12px}
.modal-body pre{background:#fafafa;padding:14px;border-radius:6px;overflow-x:auto;font-size:11.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-all;border:1px solid var(--line);font-family:"SF Mono",ui-monospace,Consolas,monospace}
.modal-footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal-footer button{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500}
.btn-copy{background:var(--ink);color:#fff}
.btn-copy:hover{opacity:.8}
.btn-copy.copied{background:#059669}

@media (max-width:560px){
  .hero{padding:18px 16px 16px}
  .metrics{gap:20px}
  .metric-value{font-size:24px}
  #content,#controls{padding-left:14px;padding-right:14px}
  .store-row{grid-template-columns:1fr 60px 50px;padding-left:28px;font-size:12px}
  header{padding:12px 16px}
  #trend-chart{height:120px}
}
</style>
</head>
<body>
<header>
<h1><span class="dot"></span>寿司郎排队</h1>
<div style="display:flex;align-items:center">
<div id="info">加载中</div>
<button id="skill-btn">Agent Skill</button>
</div>
</header>

<section class="hero">
<div class="metrics">
<div class="metric"><div class="metric-label">门店</div><div class="metric-value" id="m-total">—</div></div>
<div class="metric"><div class="metric-label">营业中</div><div class="metric-value" id="m-open">—</div></div>
<div class="metric"><div class="metric-label">总排队</div><div class="metric-value" id="m-wait">—</div><div class="metric-delta" id="m-delta"></div></div>
</div>
<div class="trend-wrap">
<div class="trend-head">
<div class="trend-title" id="trend-title">总排队趋势</div>
<div class="trend-range" id="range-btns">
<button data-h="1">1H</button>
<button data-h="3">3H</button>
<button data-h="6" class="active">6H</button>
<button data-h="12">12H</button>
</div>
</div>
<svg id="trend-chart"></svg>
<div class="trend-tooltip" id="trend-tooltip"></div>
</div>
</section>

<div id="controls"></div>
<div id="content"><div id="loading">加载排队数据</div></div>
<div id="error"></div>
<footer>数据来源 · 寿司郎官方小程序 · 每 60 秒自动刷新</footer>

<div class="modal-overlay" id="skill-modal" onclick="if(event.target===this)closeSkill()">
<div class="modal">
<div class="modal-header">
<h2>Agent 一键部署 Skill</h2>
<button class="modal-close" onclick="closeSkill()">×</button>
</div>
<div class="modal-body">
<p>复制下方内容，粘贴给 Claude Code / Codex / Cursor 即可自动部署同款项目。</p>
<pre id="skill-content">加载中…</pre>
</div>
<div class="modal-footer">
<button class="btn-copy" id="btn-copy" onclick="copySkill()">复制全部</button>
</div>
</div>
</div>

<script>
const SVG_NS='http://www.w3.org/2000/svg';
const SPARK_TOP_N=10;
let allData=null,activeCity=null,skillText='',trendHours=6,trendTimeline=[],trendChartMeta=null;
const storeHistoryCache={};
const $=id=>document.getElementById(id);

function el(tag,attrs,...children){
  const e=document.createElement(tag);
  if(attrs){
    for(const [k,v] of Object.entries(attrs)){
      if(v==null||v===false) continue;
      if(k==='class') e.className=v;
      else if(k==='dataset') Object.assign(e.dataset,v);
      else if(k==='onclick') e.addEventListener('click',v);
      else e.setAttribute(k,v);
    }
  }
  for(const c of children){
    if(c==null||c===false) continue;
    e.append(c instanceof Node?c:document.createTextNode(String(c)));
  }
  return e;
}
function svgEl(tag,attrs){
  const e=document.createElementNS(SVG_NS,tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}

async function fetchData(){
  try{
    const res=await fetch('/api/stores');
    if(!res.ok) throw new Error('HTTP '+res.status);
    allData=await res.json();
    if(!allData.ok) throw new Error(allData.error||'API error');
    render();
    $('error').style.display='none';
  }catch(e){
    $('error').textContent='加载失败 '+e.message;
    $('error').style.display='block';
  }
}

async function fetchTrend(){
  try{
    const qs='/api/history?hours='+trendHours+(activeCity?'&city='+encodeURIComponent(activeCity):'');
    const r=await fetch(qs);
    if(!r.ok){
      console.warn('history endpoint',r.status);
      drawTrend([],r.status===503?'趋势未启用 (Redis 未配置)':'趋势加载失败 ('+r.status+')');
      clearDelta();
      return;
    }
    const j=await r.json();
    if(!j.ok){
      console.warn('history payload error',j.error);
      drawTrend([],j.error||'趋势数据异常');
      clearDelta();
      return;
    }
    const tl=j.timeline||[];
    drawTrend(tl,activeCity&&!tl.length?`${activeCity} 趋势数据积累中`:'暂无数据');
    updateDelta(tl);
  }catch(e){
    console.warn('fetchTrend failed',e);
    drawTrend([],'趋势暂不可用');
    clearDelta();
  }
}

function drawTrend(timeline,emptyMsg='暂无数据'){
  const svg=$('trend-chart');
  svg.replaceChildren();
  trendTimeline=timeline;
  trendChartMeta=null;
  const rect=svg.getBoundingClientRect();
  const W=Math.round(rect.width)||600,H=Math.round(rect.height)||160;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  if(!timeline.length){
    const t=svgEl('text',{x:String(W/2),y:String(H/2),'text-anchor':'middle',fill:'#a3a3a3','font-size':'12','font-family':'-apple-system,sans-serif'});
    t.textContent=emptyMsg;
    svg.append(t);
    return;
  }
  const ML=42,MR=12,MT=12,MB=24;
  const cW=W-ML-MR,cH=H-MT-MB;
  const vals=timeline.map(d=>d.waiting);
  const dMin=0;
  let dMax=Math.max(...vals);
  if(dMax<=0) dMax=1;
  const yTicks=niceYTicks(dMin,dMax,4);
  const yMax=yTicks[yTicks.length-1]||dMax;
  const rng=yMax||1;
  const stepX=cW/Math.max(1,timeline.length-1);
  const firstD=new Date(timeline[0].time).getDate(),lastD=new Date(timeline[timeline.length-1].time).getDate();
  const xMid=firstD!==lastD;
  trendChartMeta={ML,MR,MT,MB,chartW:cW,chartH:cH,stepX,min:dMin,max:yMax,range:rng,W,H,xMid};
  for(const v of yTicks){
    const y=MT+(1-(v-dMin)/rng)*cH;
    svg.append(svgEl('line',{x1:String(ML),y1:y.toFixed(1),x2:String(W-MR),y2:y.toFixed(1),stroke:'#f0f0f0','stroke-width':'1'}));
    const lb=svgEl('text',{x:String(ML-6),y:(y+3.5).toFixed(1),'text-anchor':'end',fill:'#a3a3a3','font-size':'10','font-family':'-apple-system,sans-serif'});
    lb.textContent=v>=10000?(v/1000|0)+'k':v>=1000?(v/1000).toFixed(1)+'k':String(v);
    svg.append(lb);
  }
  svg.append(svgEl('line',{x1:String(ML),y1:String(MT),x2:String(ML),y2:String(H-MB),stroke:'#e5e5e5','stroke-width':'1'}));
  svg.append(svgEl('line',{x1:String(ML),y1:String(H-MB),x2:String(W-MR),y2:String(H-MB),stroke:'#e5e5e5','stroke-width':'1'}));

  const xN=Math.min(xMid?5:6,timeline.length);
  const hm=d=>`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const fmtX=xMid?d=>`${d.getMonth()+1}/${d.getDate()} ${hm(d)}`:hm;
  for(let i=0;i<xN;i++){
    const idx=xN===1?0:Math.round(i*(timeline.length-1)/(xN-1));
    const x=ML+idx*stepX;
    const lb=svgEl('text',{x:x.toFixed(1),y:String(H-MB+16),'text-anchor':'middle',fill:'#a3a3a3','font-size':'10','font-family':'-apple-system,sans-serif'});
    lb.textContent=fmtX(new Date(timeline[idx].time));
    svg.append(lb);
  }

  const pts=timeline.map((d,i)=>[ML+i*stepX,MT+(1-(d.waiting-dMin)/rng)*cH]);
  const defs=svgEl('defs');
  const grad=svgEl('linearGradient',{id:'g',x1:'0',y1:'0',x2:'0',y2:'1'});
  grad.append(svgEl('stop',{offset:'0%','stop-color':'#0a0a0a','stop-opacity':'0.06'}));
  grad.append(svgEl('stop',{offset:'100%','stop-color':'#0a0a0a','stop-opacity':'0'}));
  defs.append(grad);
  svg.append(defs);
  const area=`M${pts[0][0].toFixed(1)} ${H-MB} L`+pts.map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L')+` L${pts[pts.length-1][0].toFixed(1)} ${H-MB} Z`;
  svg.append(svgEl('path',{d:area,fill:'url(#g)'}));
  const path=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  svg.append(svgEl('path',{d:path,stroke:'#0a0a0a','stroke-width':'1.5',fill:'none'}));
  const last=pts[pts.length-1];
  svg.append(svgEl('circle',{cx:last[0].toFixed(1),cy:last[1].toFixed(1),r:'3',fill:'#dc2626'}));
  svg.append(svgEl('line',{id:'trend-xhair',x1:'0',y1:String(MT),x2:'0',y2:String(H-MB),stroke:'#a3a3a3','stroke-width':'1','stroke-dasharray':'3,3',display:'none'}));
  svg.append(svgEl('circle',{id:'trend-hdot',cx:'0',cy:'0',r:'3.5',fill:'#0a0a0a',display:'none'}));
}

function niceYTicks(lo,hi,n){
  if(lo===hi) return [lo];
  const raw=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const r=raw/mag;
  let step=r<=1.5?mag:r<=3?2*mag:r<=7?5*mag:10*mag;
  step=Math.max(1,step);
  const ticks=[];
  for(let v=Math.floor(lo/step)*step;v<=Math.ceil(hi/step)*step;v+=step) ticks.push(Math.round(v*1e6)/1e6);
  return ticks;
}

function clearDelta(){
  const e=$('m-delta');
  e.textContent='';
  e.className='metric-delta';
}

function updateDelta(timeline){
  if(timeline.length<2){ clearDelta(); return; }
  const cur=timeline[timeline.length-1].waiting;
  const ago=timeline[0].waiting;
  const diff=cur-ago;
  const e=$('m-delta');
  if(!diff){ clearDelta(); return; }
  const sign=diff>0?'↑':'↓';
  e.textContent=`${sign} ${Math.abs(diff).toLocaleString()} · 近 ${trendHours}h`;
  e.className='metric-delta '+(diff>0?'up':'down');
}

function render(){
  if(!allData||!allData.ok) return;
  $('info').textContent=new Date(allData.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(activeCity&&allData.cities[activeCity]){
    const list=allData.cities[activeCity];
    $('m-total').textContent=list.length;
    $('m-open').textContent=list.filter(s=>s.status==='OPEN').length;
    $('m-wait').textContent=list.reduce((s,st)=>s+st.wait,0).toLocaleString();
    $('trend-title').textContent=activeCity+' 排队趋势';
  }else{
    $('m-total').textContent=allData.total;
    $('m-open').textContent=allData.open;
    $('m-wait').textContent=allData.waiting.toLocaleString();
    $('trend-title').textContent='总排队趋势';
  }

  const cities=Object.keys(allData.cities).sort();
  const ctrl=$('controls');
  ctrl.replaceChildren();
  ctrl.append(el('button',{class:!activeCity?'active':null,onclick:()=>filterCity(null)},`全部 ${allData.waiting.toLocaleString()}`));
  for(const c of cities){
    const total=allData.cities[c].reduce((s,st)=>s+st.wait,0);
    ctrl.append(el('button',{class:activeCity===c?'active':null,onclick:()=>filterCity(c)},`${c} ${total}`));
  }

  const show=activeCity?{[activeCity]:allData.cities[activeCity]}:allData.cities;
  const sorted=Object.entries(show).sort((a,b)=>{
    const sa=a[1].reduce((s,st)=>s+st.wait,0);
    const sb=b[1].reduce((s,st)=>s+st.wait,0);
    return sb-sa;
  });
  const content=$('content');
  content.replaceChildren();
  if(!sorted.length){
    content.append(el('div',{id:'loading'},'无数据'));
    return;
  }

  for(const [city,stores] of sorted){
    const waitingCount=stores.filter(s=>s.wait>0).length;
    const totalWait=stores.reduce((s,st)=>s+st.wait,0);
    const openCount=stores.filter(s=>s.status==='OPEN').length;
    const opened=activeCity===city||cities.length===1;
    const block=el('div',{class:'city-block'+(opened?' open':'')});

    const stats=el('span',{class:'city-stats'});
    const strong=document.createElement('strong'); strong.textContent=totalWait;
    stats.append(strong,` 桌 · ${waitingCount}/${stores.length} 排队 · ${openCount} 营业`);
    const header=el('div',{class:'city-header',onclick:()=>toggleCity(block)},
      el('span',{class:'city-name'},
        el('span',{class:'chev'},'›'),
        city
      ),
      stats
    );
    block.append(header);

    const list=el('div',{class:'store-list'});
    const sortedStores=stores.slice().sort((a,b)=>b.wait-a.wait);
    for(const s of sortedStores){
      let cls='w0';
      if(s.wait>200) cls='w3';
      else if(s.wait>50) cls='w2';
      else if(s.wait>0) cls='w1';

      const nameCol=el('span',{class:'store-name'},
        el('span',{class:'status-dot '+(s.status==='OPEN'?'status-open':'status-closed')}),
        el('span',{class:'store-text'},s.name)
      );
      if(s.ticket!=='ONLINE') nameCol.append(el('span',{class:'ticket-tag off'},'线下'));

      const spark=el('span',{class:'store-spark',id:'spark-'+s.id});
      const wait=el('span',{class:'wait-cell '+cls},String(s.wait));
      const small=document.createElement('small'); small.textContent='桌';
      wait.append(small);

      const row=el('div',{class:'store-row'+(s.status!=='OPEN'?' offline':''),dataset:{store:String(s.id),wait:String(s.wait)}},
        nameCol,spark,wait
      );
      list.append(row);
    }
    block.append(list);
    content.append(block);
  }

  document.querySelectorAll('.city-block.open').forEach(loadSparksForBlock);
}

function loadSparksForBlock(block){
  // cron 后端只为 top-10 wait 门店存历史，前端也只对 wait>0 的 top SPARK_TOP_N 发请求，避免 fan-out
  const rows=Array.from(block.querySelectorAll('.store-row'));
  let loaded=0;
  for(const row of rows){
    if(loaded>=SPARK_TOP_N) break;
    const w=parseInt(row.dataset.wait)||0;
    if(w<=0) continue;
    loadStoreSpark(row.dataset.store);
    loaded++;
  }
}

function toggleCity(block){
  block.classList.toggle('open');
  if(block.classList.contains('open')) loadSparksForBlock(block);
}

async function loadStoreSpark(id){
  const target=$('spark-'+id);
  if(!target||target.dataset.loaded) return;
  target.dataset.loaded='1';
  let data=storeHistoryCache[id];
  if(!data){
    try{
      const r=await fetch('/api/store-history?id='+encodeURIComponent(id)+'&hours=5');
      if(!r.ok){ target.dataset.loaded=''; return; }
      const j=await r.json();
      if(!j.ok){ return; }
      data=j.timeline||[];
      storeHistoryCache[id]=data;
    }catch(e){
      console.warn('sparkline failed',id,e);
      target.dataset.loaded='';
      return;
    }
  }
  if(data.length<2){ target.replaceChildren(); return; }
  const W=80,H=22;
  const vals=data.map(d=>d.wait);
  const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
  const stepX=W/(data.length-1);
  const pts=data.map((d,i)=>[i*stepX,2+(1-(d.wait-min)/range)*(H-4)]);
  const path=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const last=pts[pts.length-1];

  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`});
  svg.append(svgEl('path',{d:path,stroke:'currentColor','stroke-width':1,fill:'none'}));
  svg.append(svgEl('circle',{cx:last[0].toFixed(1),cy:last[1].toFixed(1),r:1.5,fill:'#dc2626'}));
  target.replaceChildren(svg);
}

function filterCity(city){ activeCity=city; render(); fetchTrend(); }

$('range-btns').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  trendHours=parseInt(e.target.dataset.h);
  document.querySelectorAll('#range-btns button').forEach(b=>b.classList.toggle('active',b===e.target));
  fetchTrend();
});

(function(){
  const svg=$('trend-chart');
  function onMove(e){
    if(!trendTimeline.length||!trendChartMeta) return;
    const m=trendChartMeta,rect=svg.getBoundingClientRect();
    const sx=m.W/rect.width;
    const mx=(e.clientX-rect.left)*sx;
    const dx=mx-m.ML;
    if(dx<-4||dx>m.chartW+4){hideTip();return;}
    let idx=Math.round(dx/m.stepX);
    idx=Math.max(0,Math.min(trendTimeline.length-1,idx));
    const d=trendTimeline[idx];
    const px=m.ML+idx*m.stepX,py=m.MT+(1-(d.waiting-m.min)/m.range)*m.chartH;
    const xh=$('trend-xhair');
    if(xh){xh.setAttribute('x1',px.toFixed(1));xh.setAttribute('x2',px.toFixed(1));xh.setAttribute('display','');}
    const hd=$('trend-hdot');
    if(hd){hd.setAttribute('cx',px.toFixed(1));hd.setAttribute('cy',py.toFixed(1));hd.setAttribute('display','');}
    const tip=$('trend-tooltip');
    if(tip){
      const t=new Date(d.time);
      const hms=`${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
      const tf=m.xMid?`${t.getMonth()+1}/${t.getDate()} ${hms}`:hms;
      tip.textContent=`${tf}  排队 ${d.waiting.toLocaleString()} 桌`;
      tip.style.display='block';
      const wr=svg.parentElement.getBoundingClientRect();
      const rx=e.clientX-wr.left,ry=e.clientY-wr.top;
      const tw=tip.offsetWidth;
      tip.style.left=((rx+tw+12>wr.width)?rx-tw-8:rx+12)+'px';
      tip.style.top=Math.max(0,ry-36)+'px';
    }
  }
  svg.addEventListener('mousemove',onMove);
  svg.addEventListener('mouseleave',hideTip);
})();
function hideTip(){
  const xh=$('trend-xhair');if(xh)xh.setAttribute('display','none');
  const hd=$('trend-hdot');if(hd)hd.setAttribute('display','none');
  const tip=$('trend-tooltip');if(tip)tip.style.display='none';
}
let _rt;
window.addEventListener('resize',function(){clearTimeout(_rt);_rt=setTimeout(function(){if(trendTimeline.length)drawTrend(trendTimeline);},200);});

  try{
    await navigator.clipboard.writeText(skillText);

    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='复制全部'; btn.classList.remove('copied'); },2000);
  }catch(e){}
}
